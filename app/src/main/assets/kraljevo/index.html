<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Local SVG Vector Map Test</title>
    <link rel="stylesheet" href="css/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
	<link rel="stylesheet" href="css/gps-marker.css"/>
    <style>
        /* Force the map to fill the entire mobile phone or desktop browser window */
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f5f5f5; /* Light fallback background color */
        }
		
		@font-face {
			font-family: "Roboto Condensed";
			src: url('./fonts/roboto-condensed-v31.woff2') format('woff2');
			font-optical-sizing: auto;
			font-weight: 400;
			font-style: normal;
		 }

		 @font-face {
		   font-family: "Open Sans Condensed";
		   src: url('./fonts/open-sans-condensed-700.woff2') format('woff2');
		   font-optical-sizing: auto;
		   font-weight: 700;
		   font-style: normal;
		}

		svg text {
		  font-family: "Open Sans Condensed", "Roboto Condensed", sans-serif;
		}
    </style>
	
	<script src="js/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script src="js/gps.js"></script>
</head>
<body>

    <div id="map"></div>

    <!-- Load Leaflet JS from CDN -->
    <script>
        // 1. Define the exact geographical bounding box corners you provided
        // Format required by Leaflet: [[South, West], [North, East]]
        var bounds = [
            [43.5446216666667, 20.3722611111111], // South-West corner
            [43.8649427777778, 20.9997369444444]  // North-East corner
        ];

        // 2. Initialize the Leaflet map container
        var map = L.map('map', {
            maxBounds: bounds,         // Don't let the user pan out of your map bounds
            maxBoundsViscosity: 0.8,    // Elastic boundary pull back effect
            minZoom: 12,                 // Prevent zooming too far out
            maxZoom: 14,                 // Allow deep pinch zoom (up to 18x equivalent) to show crisp detail
			
			zoomSnap: 0,             // DISABLES integer snapping entirely (allows 5.24, 7.81, etc.)
            zoomDelta: 0.2,          // Makes keyboard (+/-) and double-click zoom steps very gradual
			inertia: true,
            
			zoomControl: false,
            attributionControl: false
        });
		
		// 3. GPS marker.
		var gpsTracker = initMapGpsTracker(map, bounds);
		window.setGpsLocation = function(latitude, longitude) {
            if (gpsTracker && typeof gpsTracker.updatePosition === 'function') {
                gpsTracker.updatePosition(latitude, longitude);
            }
        };

        // 4. Define the path to your single local SVG map file
        var svgUrl = 'kraljevo.svg';
		
		// 5. Fetch the external SVG file text
		fetch(svgUrl)
		  .then(response => response.text())
		  .then(svgText => {
			// 2. Parse the text string into a real DOM node element
			const parser = new DOMParser();
			const svgDoc = parser.parseFromString(svgText, 'image/svg+xml');
			const svgElement = svgDoc.documentElement;

			L.svgOverlay(svgElement, bounds).addTo(map);
		  });

		  
        // 6. Instantly snap the viewport camera to show your entire bounding box area on startup
        map.fitBounds(bounds);
    </script>
</body>
</html>
